# ~/.config/keihi/config.toml の例（docs/mvp-plan.md T1-2）。シークレットはここに書かない（secrets.env へ）。

[paths]
# data_dir = "/home/<user>/.local/share/keihi"   # 既定。keihi.db・objects/・freee-token.json を置く

[gemini]
# model = "gemini-3.8-flash"
# Cloud Billing を有効にした keihi 専用プロジェクトのキーであることを確かめてから true にする。
paid_tier_confirmed = false
# U7 の暫定値（T0-3r の結果で変える）。"low" / "medium" / "high"
# thinking_level = "low"
# media_resolution = "medium"
# 出力トークン（思考込み）の上限。トークン爆発の防止。既定 8192
# max_output_tokens = 8192

[freee]
# テスト事業所と本番事業所は別の名前で持つ。
# poc_company_id = 1234567
# prod_company_id = 7654321
# worker が使う事業所。G1 で "prod" に変える。
# target = "poc"                # "poc" / "prod"
# 予算（1 日 3,000 回）の日の区切り。F16 が分かるまで "jst"（JST の暦日）だけ。
# day_boundary = "jst"

[provider]
# kind = "freee"                # "freee" / "fake"（開発用。freee を呼ばず、プロセス内のメモリだけ）

[ingest]
# max_upload_bytes = 20971520   # 20MB

[calendar]
# deadline_mode = "early"       # "early"（受領から 7 営業日）/ "cycle"（2 か月 + 7 営業日。規程がある場合だけ）
# year_end_holidays = false     # true で 12/29〜1/3 を休業日に含める

[deadline]
# count_from = "receipt_day"    # "receipt_day"（受領日が営業日ならその日を 1 日目）/ "next_day"（翌日から数える）。税理士確認 #3 で変える前提

[web]
# port = 8795                   # 127.0.0.1 にだけバインドする（バインド先は設定できない）
# Tailscale-User-Login の許可リスト。空なら /healthz 以外はすべて 403。
# allowed_users = ["you@example.com"]
# Host の許可リスト（127.0.0.1:<port> は常に許可）。tailscale serve のホスト名を足す（docs/ops/serve.md）。
# allowed_hosts = ["<machine>.<tailnet>.ts.net:8444"]

[mcp]
# port = 8796                   # M7（keihi MCP）用の予約。M7 までは開かない

[backup]
# restic の保存先。無ければ secrets.env の RESTIC_REPOSITORY（docs/ops/backup.md）
# repository = "b2:<bucket>:keihi"
# keep_snapshots = 7            # DB のスナップショット（snapshots/）を残す数
# check_interval_days = 7       # restic check の間隔
# read_data_subset = "5%"       # restic check --read-data-subset
# drill_dir = "/home/<user>/.local/share/keihi/drill"   # 既定 <data_dir>/drill。リストア訓練の復元先
# remote_verify_mode = "download_only"   # "download_only" / "sha256"（F6 の確認後）

[reconcile]
# 日次照合（freee の取引と送った内容を比べる）
# verified_lookback_days = 35   # verified の取引を照合し直す範囲（発生日が直近この日数）
# max_list_pages = 20           # listDeals を取るページ数の上限（1 ページ 100 件）。超えた分は翌日に回す

[retention]
# docs/ops/retention.md の案。税理士確認 #8 で確定する
# years = 7                     # 法定の期間（一律）
# extra_years = 1               # 余裕
# start = "next_year_0316"      # 起算日。受領日の年分の翌年 3/16（確定申告期限の翌日）
